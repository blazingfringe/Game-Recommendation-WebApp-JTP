version: "3"
services:
  frontend:
    stdin_open: true
    build: ./frontend/
    container_name: game_recommendation_frontend
    restart: always
    ports:
      - 3000:3000
    depends_on:
      - backend
    links:
      - backend
    tty: true

  backend:
    build: ./backend/
    container_name: game_recommendation_backend
    restart: always
    command: "python3 ./run_server.py"
    ports:
      - 8000:5000
    links:
      - mysql
    depends_on:
      mysql:
        condition: "service_healthy"

  mysql:
    build: ./database/
    container_name: game_recommendation_database
    restart: always
    environment:
      MYSQL_DATABASE: 'games_db'
      MYSQL_ROOT_PASSWORD: 'root'
    # MySQL is accessed by the backend on the Compose network only.
    # No host port is needed for the application.
    healthcheck:
      # TCP avoids reporting success against the temporary init server.
      test: ["CMD-SHELL", "mysql --protocol=TCP --host=127.0.0.1 --user=root --password=\"${MYSQL_ROOT_PASSWORD}\" --execute=\"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 60